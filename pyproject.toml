[project]
name = "deviant-scan"
version = "0.0.1"
description = "Finds bugs where code breaks the project's own patterns."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["static-analysis", "bug-detection", "code-quality", "fastapi", "github-actions", "claude-code", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/ImalkaPerera/deviant"
Documentation = "https://github.com/ImalkaPerera/deviant/tree/main/docs"
Issues = "https://github.com/ImalkaPerera/deviant/issues"

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["pytest>=8", "PyYAML>=6", "ruff==0.17.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []  # Phase 1 adds the real package; this stops auto-discovery

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/deviant/scripts", "skills/deviant/scripts/detectors"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
