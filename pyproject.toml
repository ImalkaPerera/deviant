[project]
name = "deviant-scan"
version = "0.0.1"
description = "Finds bugs where code breaks the project's own patterns."
readme = "README-pypi.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
keywords = ["static-analysis", "bug-detection", "code-quality", "fastapi", "github-actions", "claude-code", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/ImalkaPerera/deviant"
Documentation = "https://github.com/ImalkaPerera/deviant/tree/main/docs"
Issues = "https://github.com/ImalkaPerera/deviant/issues"
Source = "https://github.com/ImalkaPerera/deviant"

[project.scripts]
deviant-scan = "deviant_scan.mine:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# The code lives inside the skill folder so that the Claude Code skill stays self-contained.
# The same package is what gets published to PyPI.
[tool.setuptools]
package-dir = {"" = "skills/deviant/scripts"}
packages = ["deviant_scan", "deviant_scan.detectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/deviant/scripts"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
