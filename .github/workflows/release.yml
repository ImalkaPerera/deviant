name: Release

# Publishes to PyPI when a version tag such as v0.1.0 is pushed. It uses PyPI trusted
# publishing, so no token or password is stored in this repository. See RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Nothing is published unless the tagged commit is on main and passes the same lint and tests
  # as CI. A tag pushed from a branch, or onto a commit with failing tests, stops here.
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the history is needed to tell whether the tag is on main
      - name: Check that the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main" >&2
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  build:
    timeout-minutes: 10
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # lets PyPI verify that this workflow, in this repository, is the publisher
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
