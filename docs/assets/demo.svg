<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="352" viewBox="0 0 1060 352" role="img" aria-labelledby="t d">
  <title id="t">An example Deviant scan</title>
  <desc id="d">Terminal output. Deviant reports that 47 of 48 routes check auth, shows the one that does not, app/routes/items.py line 244, who last changed it and why, and that the same author wrote all 47 routes that do check auth.</desc>
  <defs><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2330"/><stop offset="1" stop-color="#161b22"/></linearGradient></defs>
  <rect x="1" y="1" width="1058" height="350" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M 1 17 A 16 16 0 0 1 17 1 H 1043 A 16 16 0 0 1 1059 17 V 48 H 1 Z" fill="url(#bar)"/>
  <line x1="1" y1="48" x2="1059" y2="48" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="32" cy="25" r="7" fill="#ff5f56"/><circle cx="56" cy="25" r="7" fill="#ffbd2e"/><circle cx="80" cy="25" r="7" fill="#27c93f"/>
  <text x="530" y="30" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6e7681">~/api  —  example scan</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16">
    <text x="40" y="96" xml:space="preserve"><tspan fill="#3fb950">$</tspan> <tspan fill="#f0f6fc">python skills/deviant/scripts/mine.py --repo . --with-git</tspan></text>
<text x="40" y="148" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">python_routes.fastapi_routes:app/routes.</tspan><tspan fill="#388bfd" font-weight="700">has_auth</tspan>  <tspan fill="#6e7681">n=</tspan><tspan fill="#9da7b3">48</tspan> <tspan fill="#6e7681">s=</tspan><tspan fill="#3fb950">47</tspan> <tspan fill="#6e7681">v=</tspan><tspan fill="#f78166">1</tspan> <tspan fill="#6e7681">wlb95=</tspan><tspan fill="#9da7b3">0.891</tspan></text>
<text x="40" y="174" xml:space="preserve" fill="#9da7b3">  In fastapi_routes:app/routes, has_auth is true</text>
<rect x="24" y="181" width="5" height="100" rx="2.5" fill="#f78166"/>
<text x="40" y="200" xml:space="preserve"><tspan fill="#6e7681">  exception:</tspan> <tspan fill="#f78166" font-weight="700">app/routes/items.py:244</tspan> <tspan fill="#f0f6fc">(POST /api/v1/users/export)</tspan></text>
<text x="40" y="226" xml:space="preserve"><tspan fill="#6e7681">    last changed:</tspan> <tspan fill="#9da7b3">52c027b 2026-10-17 by</tspan> <tspan fill="#f0f6fc">dana@example.com</tspan></text>
<text x="40" y="252" xml:space="preserve"><tspan fill="#6e7681">    commit:</tspan> <tspan fill="#f0f6fc">add csv export</tspan></text>
<text x="40" y="278" xml:space="preserve"><tspan fill="#6e7681">    same author wrote</tspan> <tspan fill="#3fb950" font-weight="700">47 of the 47</tspan> <tspan fill="#6e7681">compliant items checked</tspan></text>
  </g>
  <path d="M 702 211 Q 712 211 712 221 V 269 Q 712 279 702 279" fill="none" stroke="#79c0ff" stroke-opacity="0.55" stroke-width="1.5"/>
  <line x1="702" y1="142" x2="738" y2="142" stroke="#3fb950" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="748" y="127" width="276" height="30" rx="15" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.65" stroke-width="1.5"/><circle cx="766" cy="142" r="9" fill="#3fb950"/><text x="766" y="146.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#0d1117">1</text><text x="786" y="147" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3fb950">47 of 48 routes check auth</text><line x1="702" y1="194" x2="738" y2="194" stroke="#f78166" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="748" y="179" width="276" height="30" rx="15" fill="#f78166" fill-opacity="0.12" stroke="#f78166" stroke-opacity="0.65" stroke-width="1.5"/><circle cx="766" cy="194" r="9" fill="#f78166"/><text x="766" y="198.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#0d1117">2</text><text x="786" y="199" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f78166">The one that doesn't</text><line x1="702" y1="252" x2="738" y2="252" stroke="#79c0ff" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="748" y="237" width="276" height="30" rx="15" fill="#79c0ff" fill-opacity="0.12" stroke="#79c0ff" stroke-opacity="0.65" stroke-width="1.5"/><circle cx="766" cy="252" r="9" fill="#79c0ff"/><text x="766" y="256.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#0d1117">3</text><text x="786" y="257" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#79c0ff">Who changed it, when and why</text>
  <line x1="40" y1="298" x2="1020" y2="298" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="322" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#c9d1d9">The same person wrote all 47 routes that do check auth, so this looks like a <tspan font-weight="700" fill="#f78166">slip</tspan>, not a choice.</text>
</svg>
