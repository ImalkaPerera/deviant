<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="262" viewBox="0 0 1000 262" role="img" aria-labelledby="t d">
  <title id="t">How Deviant works</title>
  <desc id="d">Four steps: group similar things, count the pattern and the exceptions, show git evidence for each exception, and in the future let Claude judge each one.</desc>
  <rect x="1" y="1" width="998" height="260" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="30" y="36" width="210" height="190" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><circle cx="64" cy="78" r="18" fill="#388bfd" fill-opacity="0.18" stroke="#388bfd" stroke-width="2"/><text x="64" y="84" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#388bfd">1</text><text x="94" y="85" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">Group</text><text x="52" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">Checks list similar</text><text x="52" y="154" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">things: every route,</text><text x="52" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">every CI job.</text><path d="M 246 131 H 268" stroke="#6e7681" stroke-width="2.5" fill="none"/><path d="M 262 123 L 274 131 L 262 139" stroke="#6e7681" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="280" y="36" width="210" height="190" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><circle cx="314" cy="78" r="18" fill="#388bfd" fill-opacity="0.18" stroke="#388bfd" stroke-width="2"/><text x="314" y="84" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#388bfd">2</text><text x="344" y="85" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">Count</text><text x="302" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">Plain math finds the</text><text x="302" y="154" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">pattern and the rare</text><text x="302" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">exceptions. No AI.</text><path d="M 496 131 H 518" stroke="#6e7681" stroke-width="2.5" fill="none"/><path d="M 512 123 L 524 131 L 512 139" stroke="#6e7681" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="530" y="36" width="210" height="190" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><circle cx="564" cy="78" r="18" fill="#388bfd" fill-opacity="0.18" stroke="#388bfd" stroke-width="2"/><text x="564" y="84" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#388bfd">3</text><text x="594" y="85" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">Evidence</text><text x="552" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">Git history for each</text><text x="552" y="154" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">exception: who, when,</text><text x="552" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">and why.</text><path d="M 746 131 H 768" stroke="#6e7681" stroke-width="2.5" fill="none"/><path d="M 762 123 L 774 131 L 762 139" stroke="#6e7681" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="780" y="36" width="210" height="190" rx="14" fill="#161b22" stroke="#f78166" stroke-width="2" stroke-dasharray="7 6"/><circle cx="814" cy="78" r="18" fill="#f78166" fill-opacity="0.18" stroke="#f78166" stroke-width="2"/><text x="814" y="84" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f78166">4</text><text x="844" y="85" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#c9d1d9">Judge</text><text x="802" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">Claude reads the</text><text x="802" y="154" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">evidence and labels</text><text x="802" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">each one.</text><rect x="802" y="192" width="64" height="22" rx="11" fill="#f78166" fill-opacity="0.15" stroke="#f78166" stroke-opacity="0.6" stroke-width="1.5"/><text x="834" y="208" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f78166" letter-spacing="1">SOON</text>
</svg>
