<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Deviant</title>
  <desc id="desc">A grid of identical blue dots with one orange dot out of line, next to the text: Deviant. Catch the one route that forgot its auth check.</desc>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="140" font-size="84" font-weight="700" fill="#f0f6fc">Deviant</text>
    <text x="68" y="190" font-size="24" fill="#c9d1d9">Catch the one route that forgot its auth check.</text>
    <text x="68" y="228" font-size="16" fill="#8b949e">Finds bugs by spotting code that breaks your project's own patterns.</text>
  </g>

  <!-- 8 columns by 4 rows of dots, spaced 56 apart. The dot at column 5, row 1 is left out
       of the grid and drawn separately, nudged out of line. -->
  <g fill="#388bfd" fill-opacity="0.6">
    <circle cx="700" cy="70" r="9"/><circle cx="756" cy="70" r="9"/><circle cx="812" cy="70" r="9"/><circle cx="868" cy="70" r="9"/><circle cx="924" cy="70" r="9"/><circle cx="980" cy="70" r="9"/><circle cx="1036" cy="70" r="9"/><circle cx="1092" cy="70" r="9"/>
    <circle cx="700" cy="126" r="9"/><circle cx="756" cy="126" r="9"/><circle cx="812" cy="126" r="9"/><circle cx="868" cy="126" r="9"/><circle cx="924" cy="126" r="9"/><circle cx="1036" cy="126" r="9"/><circle cx="1092" cy="126" r="9"/>
    <circle cx="700" cy="182" r="9"/><circle cx="756" cy="182" r="9"/><circle cx="812" cy="182" r="9"/><circle cx="868" cy="182" r="9"/><circle cx="924" cy="182" r="9"/><circle cx="980" cy="182" r="9"/><circle cx="1036" cy="182" r="9"/><circle cx="1092" cy="182" r="9"/>
    <circle cx="700" cy="238" r="9"/><circle cx="756" cy="238" r="9"/><circle cx="812" cy="238" r="9"/><circle cx="868" cy="238" r="9"/><circle cx="924" cy="238" r="9"/><circle cx="980" cy="238" r="9"/><circle cx="1036" cy="238" r="9"/><circle cx="1092" cy="238" r="9"/>
  </g>

  <!-- the deviant -->
  <circle cx="994" cy="140" r="22" fill="none" stroke="#f78166" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="994" cy="140" r="10" fill="#f78166"/>

  <text x="700" y="288" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Everything follows the pattern. One thing doesn't.</text>
</svg>
