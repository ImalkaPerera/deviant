<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Deviant</title>
  <desc id="d">A grid of identical blue dots with one orange dot out of line, labelled POST /users/export, no auth check. Next to it: Deviant. Catch the one route that forgot its auth check.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#121923"/></linearGradient>
    <radialGradient id="glow" cx="1011" cy="133" r="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f78166" stop-opacity="0.34"/><stop offset="0.55" stop-color="#f78166" stop-opacity="0.08"/><stop offset="1" stop-color="#f78166" stop-opacity="0"/></radialGradient>
    <radialGradient id="blueglow" cx="300" cy="120" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#388bfd" stop-opacity="0.14"/><stop offset="1" stop-color="#388bfd" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#79c0ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#388bfd"/><stop offset="1" stop-color="#f78166"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#388bfd" stop-opacity="0"/><stop offset="0.7" stop-color="#f78166" stop-opacity="0.45"/><stop offset="1" stop-color="#f78166" stop-opacity="0.8"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="url(#blueglow)"/>
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="url(#glow)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="70" y="82" font-size="13" font-weight="700" fill="#79c0ff" letter-spacing="3">OPEN SOURCE  ·  FINDS THE ODD ONE OUT</text>
    <text x="66" y="170" font-size="100" font-weight="800" fill="url(#title)" letter-spacing="-3">Deviant</text>
    <rect x="72" y="186" width="168" height="6" rx="3" fill="url(#accent)"/>
    <text x="70" y="232" font-size="27" font-weight="500" fill="#e6edf3">Catch the one route that forgot its auth check.</text>
    <text x="70" y="264" font-size="17" fill="#9da7b3">Learns your project's own patterns, then flags what breaks them.</text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#9da7b3">
    <rect x="70" y="284" width="86" height="30" rx="15" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="113" y="304" text-anchor="middle">FastAPI</text>
    <rect x="166" y="284" width="130" height="30" rx="15" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="231" y="304" text-anchor="middle">GitHub Actions</text>
    <rect x="306" y="284" width="118" height="30" rx="15" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="365" y="304" text-anchor="middle">Git evidence</text>
  </g>

  <line x1="664" y1="133" x2="981" y2="133" stroke="url(#scan)" stroke-width="2"/>
  <g><circle cx="694" cy="60" r="10" fill="#388bfd" fill-opacity="0.90"/><circle cx="754" cy="60" r="10" fill="#388bfd" fill-opacity="0.90"/><circle cx="814" cy="60" r="10" fill="#388bfd" fill-opacity="0.90"/><circle cx="874" cy="60" r="10" fill="#388bfd" fill-opacity="0.90"/><circle cx="934" cy="60" r="10" fill="#388bfd" fill-opacity="0.90"/><circle cx="994" cy="60" r="10" fill="#388bfd" fill-opacity="0.90"/><circle cx="1054" cy="60" r="10" fill="#388bfd" fill-opacity="0.90"/><circle cx="1114" cy="60" r="10" fill="#388bfd" fill-opacity="0.90"/><circle cx="694" cy="120" r="10" fill="#388bfd" fill-opacity="0.75"/><circle cx="754" cy="120" r="10" fill="#388bfd" fill-opacity="0.75"/><circle cx="814" cy="120" r="10" fill="#388bfd" fill-opacity="0.75"/><circle cx="874" cy="120" r="10" fill="#388bfd" fill-opacity="0.75"/><circle cx="934" cy="120" r="10" fill="#388bfd" fill-opacity="0.75"/><circle cx="1054" cy="120" r="10" fill="#388bfd" fill-opacity="0.75"/><circle cx="1114" cy="120" r="10" fill="#388bfd" fill-opacity="0.75"/><circle cx="694" cy="180" r="10" fill="#388bfd" fill-opacity="0.60"/><circle cx="754" cy="180" r="10" fill="#388bfd" fill-opacity="0.60"/><circle cx="814" cy="180" r="10" fill="#388bfd" fill-opacity="0.60"/><circle cx="874" cy="180" r="10" fill="#388bfd" fill-opacity="0.60"/><circle cx="934" cy="180" r="10" fill="#388bfd" fill-opacity="0.60"/><circle cx="994" cy="180" r="10" fill="#388bfd" fill-opacity="0.60"/><circle cx="1054" cy="180" r="10" fill="#388bfd" fill-opacity="0.60"/><circle cx="1114" cy="180" r="10" fill="#388bfd" fill-opacity="0.60"/><circle cx="694" cy="240" r="10" fill="#388bfd" fill-opacity="0.45"/><circle cx="754" cy="240" r="10" fill="#388bfd" fill-opacity="0.45"/><circle cx="814" cy="240" r="10" fill="#388bfd" fill-opacity="0.45"/><circle cx="874" cy="240" r="10" fill="#388bfd" fill-opacity="0.45"/><circle cx="934" cy="240" r="10" fill="#388bfd" fill-opacity="0.45"/><circle cx="994" cy="240" r="10" fill="#388bfd" fill-opacity="0.4