    <rect x="72" y="166" width="150" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="70" y="212" font-size="26" font-weight="500" fill="#e6edf3">Catch the one route that forgot its auth check.</text>
    <text x="70" y="244" font-size="17" fill="#9da7b3">Finds bugs by spotting code that breaks your project's own patterns.</text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#9da7b3">
