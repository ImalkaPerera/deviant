  <circle cx="1011" cy="133" r="38" fill="none" stroke="#f78166" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="1011" cy="133" r="27" fill="none" stroke="#f78166" stroke-opacity="0.45" stroke-width="2"/>
