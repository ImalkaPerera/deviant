<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Deviant</title>
  <desc id="d">A grid of identical blue dots with one orange dot out of line, labelled POST /users/export, no auth check. Next to it: Deviant. Catch the one route that forgot its auth check.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <radialGradient id="glow" cx="996" cy="132" r="150" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f78166" stop-opacity="0.30"/><stop offset="1" stop-color="#f78166" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#388bfd"/><stop offset="1" stop-color="#f78166"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="url(#glow)"/>

